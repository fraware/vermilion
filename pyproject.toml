[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vermilion-external-cli"
version = "0.1.0a0"
description = "External-project client for a separately built Vermilion Rust/Lean verifier"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
vrml = "vrml_external:main"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = ["vrml_external", "vrml_external_verify", "vrml_external_bindings"]
