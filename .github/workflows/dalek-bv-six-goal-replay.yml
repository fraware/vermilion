name: Dalek BV six exact source-goal replay (research)

on:
  push:
    branches:
      - research/dalek-bv-six-goal-replay
      - proof/dalek-bitwise-six-twins-20261025
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dalek-bv-six-replay-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-source-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate provenance analyzer
        run: |
          python3 -m py_compile scripts/audit_dalek_bv_provenance.py
          python3 -m py_compile scripts/replay_dalek_bv_goals.py
          python3 -m py_compile scripts/replay_dalek_bv_contexts.py
          python3 -m py_compile scripts/replay_dalek_bv_full_blocks.py
          python3 -m unittest discover -s tests -p test_dalek_bv_full_blocks.py -v
          python3 -m unittest discover -s tests -p test_dalek_bv_context_replay.py -v
          python3 scripts/audit_dalek_bv_provenance.py --help
          python3 -m py_compile scripts/classify_dalek_tracked_unit.py
          python3 -m unittest discover -s tests -p test_dalek_unit_classifier.py -v
          python3 -m py_compile scripts/compare_dalek_bv_modes.py
          python3 scripts/compare_dalek_bv_modes.py --help
      - name: Install pinned Verus and Lean host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libc++-dev libc++abi-dev libgmp-dev \
            cmake ninja-build pkg-config libssl-dev curl unzip zstd git
          if ! command -v elan >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | \
              sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned native toolchain cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.cache/vermilion/verus
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            ~/.elan/toolchains
            .lake
            target
            crates/vermilion_direct/target
          key: native-v3-\${{ runner.os }}-\${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'Cargo.lock', 'crates/vermilion_direct/Cargo.lock', 'scripts/setup_verus.sh', 'crates/vermilion_direct/src/lower.rs') }}
          restore-keys: |
            native-v3-\${{ runner.os }}-
      - name: Build pinned Rust adapter and Lean generator
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          ./scripts/build.sh
      - name: Capture pinned dalek source, VIR, SST, IR, and generated Lean
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          mkdir -p .vermilion/dalek-provenance
          ./case-studies/dalek-lite/fetch_upstream.sh
          ./scripts/setup_verus.sh
          repository="$PWD"
          source scripts/verus_env.sh
          rustup run "$verus_toolchain" rustc --edition=2021 \
            --crate-name subtle --crate-type rlib \
            case-studies/dalek-lite/subtle_stub.rs \
            -o .vermilion/dalek-provenance/libsubtle_stub.rlib
          VERUS_VIR_EXPORT="$repository/.vermilion/dalek-provenance/dalek-vir.bin" \
            "$verus" case-studies/dalek-lite/layer_a.rs \
            --crate-type=lib \
            --extern "subtle=$repository/.vermilion/dalek-provenance/libsubtle_stub.rlib" \
            --no-verify > .vermilion/dalek-provenance/frontend.stdout \
                        2> .vermilion/dalek-provenance/frontend.stderr
          VERMILION_BV_PROVENANCE=1 \
            ./crates/vermilion_direct/target/release/vermilion_direct \
            .vermilion/dalek-provenance/dalek-vir.bin \
            --out .vermilion/dalek-provenance/dalek-ir.sexp \
            > .vermilion/dalek-provenance/lower.stdout \
            2> .vermilion/dalek-provenance/lower.stderr
          source scripts/lean_env.sh
          vrml_lake_build_if_stale vrml_gen Vermilion
          ./.lake/build/bin/vrml_gen --mode per-function \
            --generated-root case-studies/dalek-lite/generated \
            .vermilion/dalek-provenance/dalek-ir.sexp \
            > .vermilion/dalek-provenance/generator.stdout \
            2> .vermilion/dalek-provenance/generator.stderr
          python3 scripts/audit_dalek_bv_provenance.py \
            --repo "$repository" \
            --generated case-studies/dalek-lite/generated \
            --trace .vermilion/dalek-provenance/lower.stderr \
            --output .vermilion/dalek-provenance/provenance.json
          git -C case-studies/dalek-lite/upstream rev-parse HEAD \
            > .vermilion/dalek-provenance/upstream-pin.txt
          test "$(cat .vermilion/dalek-provenance/upstream-pin.txt)" = \
            de9ebf01599fedbbced28b938e2c36c538fe4ae5
          (cd .vermilion/dalek-provenance &&
            sha256sum dalek-vir.bin dalek-ir.sexp provenance.json > SHA256SUMS)
          python3 - <<'PY'
          import json
          import pathlib
          import shutil
          out=pathlib.Path(".vermilion/dalek-provenance")
          observations=json.loads((out/"provenance.json").read_text())["observations"]
          copied=set()
          target=out/"selected-lean"
          target.mkdir(exist_ok=True)
          for item in observations:
              source=pathlib.Path(item["generated_lean"]["lean_file"])
              if source not in copied:
                  shutil.copy2(source,target/source.name)
                  copied.add(source)
          print(f"Preserved {len(copied)} generated target Lean modules")
          PY
          # A second, source-identical pass disables ONLY the pinned
          # Verus SST bit-vector constant simplifier. This must expose
          # the source-level propositions to the Lean renderer.
          VERMILION_NO_BV_SIMPLIFY=1 VERMILION_BV_PROVENANCE=1 \
            ./crates/vermilion_direct/target/release/vermilion_direct \
            .vermilion/dalek-provenance/dalek-vir.bin \
            --out .vermilion/dalek-provenance/dalek-ir-no-bv-simplify.sexp \
            > .vermilion/dalek-provenance/lower-unsimplified.stdout \
            2> .vermilion/dalek-provenance/lower-unsimplified.stderr
          ./.lake/build/bin/vrml_gen --mode per-function \
            --generated-root case-studies/dalek-lite/generated-unsimplified \
            .vermilion/dalek-provenance/dalek-ir-no-bv-simplify.sexp \
            > .vermilion/dalek-provenance/generator-unsimplified.stdout \
            2> .vermilion/dalek-provenance/generator-unsimplified.stderr
          python3 scripts/audit_dalek_bv_provenance.py \
            --repo "$repository" \
            --generated case-studies/dalek-lite/generated-unsimplified \
            --trace .vermilion/dalek-provenance/lower-unsimplified.stderr \
            --output .vermilion/dalek-provenance/provenance-unsimplified.json
          python3 scripts/compare_dalek_bv_modes.py \
            .vermilion/dalek-provenance/provenance.json \
            .vermilion/dalek-provenance/provenance-unsimplified.json \
            --output .vermilion/dalek-provenance/mode-comparison.json
          (cd .vermilion/dalek-provenance &&
            sha256sum dalek-ir-no-bv-simplify.sexp \
              provenance-unsimplified.json mode-comparison.json \
              >> SHA256SUMS)
          python3 - <<'PY'
          import json
          import pathlib
          import shutil
          out=pathlib.Path(".vermilion/dalek-provenance")
          observations=json.loads((out/"provenance-unsimplified.json").read_text())["observations"]
          copied=set()
          target=out/"selected-lean-unsimplified"
          target.mkdir(exist_ok=True)
          for item in observations:
              source=pathlib.Path(item["generated_lean"]["lean_file"])
              if source not in copied:
                  shutil.copy2(source,target/source.name)
                  copied.add(source)
          print(f"Preserved {len(copied)} unsimplified Lean modules")
          PY
      - name: Extract and kernel-check six exact unsimplified source goals
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          python3 scripts/replay_dalek_bv_goals.py \
            --generated case-studies/dalek-lite/generated-unsimplified \
            --report .vermilion/dalek-provenance/provenance-unsimplified.json \
            --output .vermilion/dalek-provenance/six-exact-goals.lean \
            --receipt .vermilion/dalek-provenance/six-goal-receipt.json
          timeout 480s lake env lean \
            .vermilion/dalek-provenance/six-exact-goals.lean \
            > .vermilion/dalek-provenance/six-goal-lean.stdout \
            2> .vermilion/dalek-provenance/six-goal-lean.stderr
          test ! -s .vermilion/dalek-provenance/six-goal-lean.stderr
          if grep -Eiq 'sorryAx|sorry|admit' \
            .vermilion/dalek-provenance/six-goal-lean.stdout; then
            echo "Unexpected admission in axiom audit" >&2
            exit 2
          fi
          (cd .vermilion/dalek-provenance && \
            sha256sum six-exact-goals.lean six-goal-receipt.json \
            six-goal-lean.stdout six-goal-lean.stderr \
            >> SHA256SUMS)
          echo "SIX_EXACT_SOURCED_GOALS_KERNEL_CHECKED"
      - name: Preserve six-goal Lean receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dalek-bv-six-exact-goal-replay
          path: |
            .vermilion/dalek-provenance/six-exact-goals.lean
            .vermilion/dalek-provenance/six-goal-receipt.json
            .vermilion/dalek-provenance/six-goal-lean.stdout
            .vermilion/dalek-provenance/six-goal-lean.stderr
          if-no-files-found: warn
          retention-days: 14
      - name: Kernel-check six original generated theorem contexts
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          evidence=".vermilion/dalek-provenance"
          generated="$PWD/case-studies/dalek-lite/generated-unsimplified"
          python3 scripts/replay_dalek_bv_contexts.py \
            --generated "$generated" \
            --report "$evidence/provenance-unsimplified.json" \
            --output "$evidence/context-replay" \
            --receipt "$evidence/context-replay-receipt.json"
          source scripts/lean_env.sh
          # VrmlGen imports generated.<stem>.Specs, even though this
          # experiment emits to generated-unsimplified/. Reproduce the
          # generator's expected module namespace with byte-for-byte copies,
          # not surrogate definitions, and compile their pinned oleans.
          overlay="$PWD/$evidence/context-module-root"
          mkdir -p "$overlay/generated"
          export LEAN_PATH="$overlay:$LEAN_PATH"
          for stem in field_u64 field_lemmas_mul_lemmas pow2k_lemmas; do
            test -f "$generated/$stem/Specs.lean"
            mkdir -p "$overlay/generated/$stem"
            cp "$generated/$stem/Specs.lean" "$overlay/generated/$stem/Specs.lean"
            timeout 600s lean -o "$overlay/generated/$stem/Specs.olean" \
              "$overlay/generated/$stem/Specs.lean" \
              > "$evidence/$stem-specs.stdout" \
              2> "$evidence/$stem-specs.stderr"
            test ! -s "$evidence/$stem-specs.stderr"
            if test -f "$generated/$stem/Evidence.lean"; then
              cp "$generated/$stem/Evidence.lean" "$overlay/generated/$stem/Evidence.lean"
              timeout 600s lean -o "$overlay/generated/$stem/Evidence.olean" \
                "$overlay/generated/$stem/Evidence.lean" \
                > "$evidence/$stem-evidence.stdout" \
                2> "$evidence/$stem-evidence.stderr"
              test ! -s "$evidence/$stem-evidence.stderr"
            fi
            timeout 480s lean "$evidence/context-replay/$stem.lean" \
              > "$evidence/$stem-context.stdout" \
              2> "$evidence/$stem-context.stderr"
            test ! -s "$evidence/$stem-context.stderr"
            if grep -Eiq 'sorryAx|admit' "$evidence/$stem-context.stdout"; then
              echo "Admission found in kernel context audit" >&2
              exit 2
            fi
          done
          (cd "$evidence" &&
            sha256sum context-replay/*.lean context-replay-receipt.json \
              *-context.stdout *-context.stderr *-specs.stdout *-specs.stderr \
              >> SHA256SUMS)
          echo "SIX_ORIGINAL_THEOREM_CONTEXTS_KERNEL_CHECKED"
      - name: Preserve original-context Lean replay
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dalek-bv-six-original-contexts
          path: |
            .vermilion/dalek-provenance/context-replay/
            .vermilion/dalek-provenance/context-replay-receipt.json
            .vermilion/dalek-provenance/*-context.stdout
            .vermilion/dalek-provenance/*-context.stderr
            .vermilion/dalek-provenance/*-specs.stdout
            .vermilion/dalek-provenance/*-specs.stderr
          if-no-files-found: warn
          retention-days: 14
      - name: Kernel-check six byte-preserved original obligation blocks
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          evidence=".vermilion/dalek-provenance"
          generated="$PWD/case-studies/dalek-lite/generated-unsimplified"
          python3 scripts/replay_dalek_bv_full_blocks.py \
            --generated "$generated" \
            --report "$evidence/provenance-unsimplified.json" \
            --output "$evidence/full-block-subsets" \
            --receipt "$evidence/full-block-receipt.json"
          source scripts/lean_env.sh
          export LEAN_PATH="$PWD/$evidence/context-module-root:$LEAN_PATH"
          for stem in field_u64 field_lemmas_mul_lemmas pow2k_lemmas; do
            test -f "$evidence/full-block-subsets/$stem.lean"
            timeout 480s lean "$evidence/full-block-subsets/$stem.lean" \
              > "$evidence/$stem-block.stdout" \
              2> "$evidence/$stem-block.stderr"
            test ! -s "$evidence/$stem-block.stderr"
            if grep -Eiq 'sorryAx|admit' "$evidence/$stem-block.stdout"; then
              echo "Admission found in generated block audit" >&2
              exit 2
            fi
          done
          (cd "$evidence" &&
            sha256sum full-block-subsets/*.lean full-block-receipt.json \
              *-block.stdout *-block.stderr >> SHA256SUMS)
          echo "SIX_ORIGINAL_GENERATED_BLOCKS_KERNEL_CHECKED"
      - name: Preserve exact generated proof-block receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dalek-bv-six-exact-generated-blocks
          path: |
            .vermilion/dalek-provenance/full-block-subsets/
            .vermilion/dalek-provenance/full-block-receipt.json
            .vermilion/dalek-provenance/*-block.stdout
            .vermilion/dalek-provenance/*-block.stderr
          if-no-files-found: warn
          retention-days: 14
      - name: Audit six proofs in full tracked units with fail-closed outcome classification
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          evidence="$PWD/.vermilion/dalek-provenance"
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          roots = {
            "field_u64": (
              "layer_a.backend.serial.u64.field.impl__16.square2",
              "bv_5_0",
              ("bea6232ee1a2aab0", "4b5d62519b846699"),
              "layer_a_backend_serial_u64_field_impl__16_square2.lean",
            ),
            "field_lemmas_mul_lemmas": (
              "layer_a.lemmas.field_lemmas.mul_lemmas.lemma_mul_boundary",
              "bv_3_0",
              ("aba44725bf1d8c44", "3c8ee05bd5d51b4d"),
              "layer_a_lemmas_field_lemmas_mul_lemmas_lemma_mul_boundary.lean",
            ),
            "pow2k_lemmas": (
              "layer_a.lemmas.field_lemmas.pow2k_lemmas.lemma_pow2k_loop_boundary",
              "bv_3_0",
              ("f9cc1a09afee1240", "bfae7daeb21f67ff"),
              "layer_a_lemmas_field_lemmas_pow2k_lemmas_lemma_pow2k_loop_boundary.lean",
            ),
          }
          all_receipts = []
          for stem, (prefix, short, hashes, filename) in roots.items():
            manifest=json.loads(Path(f"case-studies/dalek-lite/generated/{stem}.json").read_text())
            records=manifest["obligations"]
            expected=[(prefix+".assert_"+(short if i==0 else short+"_1"), hashval)
                      for i,hashval in enumerate(hashes)]
            for name,digest in expected:
              rows=[r for r in records if r["name"]==name and r["statement_hash"]==digest]
              assert len(rows)==1, f"Fresh generated source identity/hash mismatch: {name} {digest} ({len(rows)} records)"
            file=Path(f"case-studies/dalek-lite/proofs/{stem}/{filename}")
            text=file.read_text()
            entries=re.findall(r"(?m)^-- vrml:begin (\S+) ([0-9a-f]{16})\s*$",text)
            for name,digest in expected:
              assert entries.count((name,digest))==1, (file,name,digest)
              assert text.count('statementHash := "'+digest+'"')==1
            assert not re.search(r"(?m)^\s*(sorry|admit)\s*(?:--[^\n]*)?$",text), f"Tracked admission: {file}"
            all_receipts.append({"stem":stem,"proof_file":str(file),
              "source_hashes":[{"name":n,"hash":h} for n,h in expected],
              "complete_unit_native_compilation_pending":True})
          Path(".vermilion/dalek-provenance/three-tracked-unit-receipt.json").write_text(
             json.dumps({"units":all_receipts,"whole_case_study_verified":False},indent=2,sort_keys=True)+"\n")
          print("SIX_FRESH_STATEMENT_HASHES_MATCH_THREE_TRACKED_UNITS")
          PY
          source scripts/lean_env.sh
          overlay="$evidence/tracked-proof-modules"
          mkdir -p "$overlay"
          export LEAN_PATH="$overlay:$LEAN_PATH"
          for stem in field_u64 field_lemmas_mul_lemmas pow2k_lemmas; do
            mkdir -p "$overlay/$stem"
            cp "case-studies/dalek-lite/generated/$stem/Specs.lean" "$overlay/$stem/Specs.lean"
            timeout 600s lean -o "$overlay/$stem/Specs.olean" "$overlay/$stem/Specs.lean" \
              > "$evidence/$stem-tracked-specs.stdout" 2> "$evidence/$stem-tracked-specs.stderr"
            test ! -s "$evidence/$stem-tracked-specs.stderr"
            case "$stem" in
              field_u64) unit="layer_a_backend_serial_u64_field_impl__16_square2.lean";;
              field_lemmas_mul_lemmas) unit="layer_a_lemmas_field_lemmas_mul_lemmas_lemma_mul_boundary.lean";;
              pow2k_lemmas) unit="layer_a_lemmas_field_lemmas_pow2k_lemmas_lemma_pow2k_loop_boundary.lean";;
            esac
            # Classify each independent full unit: zero-error compilation
            # is success; only exact, known vrml automation errors are an
            # acceptable INCOMPLETE outcome. Timeouts and novel errors fail.
            unit_path="case-studies/dalek-lite/proofs/$stem/$unit"
            set +e
            timeout 600s lean "$unit_path" \
              > "$evidence/$stem-tracked.stdout" 2> "$evidence/$stem-tracked.stderr"
            verdict=$?
            set -e
            python3 scripts/classify_dalek_tracked_unit.py \
              --stem "$stem" --source "$unit_path" --exit-code "$verdict" \
              --stdout "$evidence/$stem-tracked.stdout" \
              --stderr "$evidence/$stem-tracked.stderr" \
              --output "$evidence/$stem-tracked-classification.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          evidence=Path(".vermilion/dalek-provenance")
          receipt_file=evidence/"three-tracked-unit-receipt.json"
          receipt=json.loads(receipt_file.read_text())
          for item in receipt["units"]:
            outcome=json.loads((evidence/(item["stem"]+"-tracked-classification.json")).read_text())
            item["complete_unit_native_compilation_pending"]=False
            item["whole_unit_compiled"]=outcome["whole_unit_compiled"]
            item["outcome"]=outcome["status"]
            item["remaining_automation_errors"]=outcome["error_count"]
          receipt_file.write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print("TRACKED_UNIT_OUTCOMES",[(r["stem"],r["outcome"],r["remaining_automation_errors"])
                 for r in receipt["units"]])
          PY
          python3 scripts/check_dalek_completion.py \
            --generated case-studies/dalek-lite/generated \
            --proofs case-studies/dalek-lite/proofs \
            --report-json "$evidence/remaining-completeness.json" \
            --expect-incomplete
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path(".vermilion/dalek-provenance/remaining-completeness.json").read_text())
          assert report["manifest_count"]==27 and report["obligation_count"]==5215
          assert report["refused_count"]==38 and report["tracked_admission_count"]==0
          assert report["accepted"] is False
          print("SIX_TARGETED_GENERATED_PROOFS_CHECKED; TRACKED_UNIT_OUTCOMES_RECORDED; 38 baseline lowering refusals")
          PY
          (cd "$evidence" && sha256sum *-tracked-classification.json three-tracked-unit-receipt.json remaining-completeness.json \
            *-tracked.stdout *-tracked.stderr *-tracked-specs.stdout *-tracked-specs.stderr \
            >> SHA256SUMS)
      - name: Preserve tracked full-unit native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dalek-six-complete-tracked-units
          path: |
            .vermilion/dalek-provenance/three-tracked-unit-receipt.json
            .vermilion/dalek-provenance/remaining-completeness.json
            .vermilion/dalek-provenance/*-tracked-classification.json
            .vermilion/dalek-provenance/*-tracked.stdout
            .vermilion/dalek-provenance/*-tracked.stderr
            .vermilion/dalek-provenance/*-tracked-specs.stdout
            .vermilion/dalek-provenance/*-tracked-specs.stderr
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve provenance (not a verification result)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dalek-bv-source-sst-ir-lean-provenance
          path: |
            .vermilion/dalek-provenance/provenance.json
            .vermilion/dalek-provenance/provenance-unsimplified.json
            .vermilion/dalek-provenance/mode-comparison.json
            .vermilion/dalek-provenance/lower-unsimplified.stderr
            .vermilion/dalek-provenance/generator-unsimplified.stderr
            .vermilion/dalek-provenance/selected-lean-unsimplified/
            .vermilion/dalek-provenance/SHA256SUMS
            .vermilion/dalek-provenance/lower.stderr
            .vermilion/dalek-provenance/frontend.stderr
            .vermilion/dalek-provenance/generator.stderr
            .vermilion/dalek-provenance/upstream-pin.txt
            .vermilion/dalek-provenance/selected-lean/
          if-no-files-found: warn
          retention-days: 14
