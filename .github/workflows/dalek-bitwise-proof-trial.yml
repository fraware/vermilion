name: Dalek bitwise original-theorem proof trial (research)

on:
  push:
    branches:
      - research/dalek-bitwise-proof-trial
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitwise-proof-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-proof-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate source-keyed proof extraction
        run: |
          python3 -m py_compile scripts/research_dalek_bitwise_proofs.py
          python3 -m py_compile scripts/migrate_dalek_bitwise_twin.py
          python3 -m unittest discover -s tests -p test_dalek_bitwise_twin_integration.py -v
          python3 scripts/research_dalek_bitwise_proofs.py --help
      - name: Install pinned Lean prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libc++-dev libc++abi-dev libgmp-dev \
            cmake ninja-build pkg-config libssl-dev curl unzip zstd git
          if ! command -v elan >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | \
              sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned Lean build cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.cache/vermilion/verus
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            ~/.elan/toolchains
            .lake
            target
            crates/vermilion_direct/target
          key: native-v3-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'Cargo.lock', 'crates/vermilion_direct/Cargo.lock', 'scripts/setup_verus.sh', 'crates/vermilion_direct/src/lower.rs') }}
          restore-keys: |
            native-v3-${{ runner.os }}-
      - name: Prepare exact pinned Vermilion imports
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          ./scripts/build.sh
      - name: Kernel-check both unchanged bitwise theorem signatures
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          mkdir -p .vermilion/bitwise-research
          python3 scripts/research_dalek_bitwise_proofs.py \
            --output .vermilion/bitwise-research/two-goals.lean \
            --receipt .vermilion/bitwise-research/receipt.json
          source scripts/lean_env.sh
          set +e
          timeout 600s lean .vermilion/bitwise-research/two-goals.lean \
            > .vermilion/bitwise-research/lean.stdout \
            2> .vermilion/bitwise-research/lean.stderr
          ret=$?
          set -e
          cat .vermilion/bitwise-research/lean.stderr
          if [ "$ret" -ne 0 ]; then exit "$ret"; fi
          test ! -s .vermilion/bitwise-research/lean.stderr
          # The research goal is an axiom-minimal Lean proof. Native SAT
          # certificate evaluation axioms are not permitted at this stage.
          if grep -Eiq 'sorryAx|admit|_native\.|Lean\.trustCompiler|Lean\.ofReduceBool|Lean\.ofReduceNat' \
              .vermilion/bitwise-research/lean.stdout; then
            echo "Native computation/admission axiom was found" >&2
            exit 2
          fi
          grep -F "'DalekBitwiseTrial.nonoverlap' depends on axioms:" \
            .vermilion/bitwise-research/lean.stdout
          grep -F "'DalekBitwiseTrial.same_position' depends on axioms:" \
            .vermilion/bitwise-research/lean.stdout
          (cd .vermilion/bitwise-research && sha256sum * > SHA256SUMS)
          echo "TWO_BITWISE_ORIGINAL_SIGNATURES_KERNEL_CHECKED"
      - name: Regenerate pinned Dalek bit-lemmas source and full unit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          repository="$PWD"
          ./case-studies/dalek-lite/fetch_upstream.sh
          ./scripts/setup_verus.sh
          source scripts/verus_env.sh
          mkdir -p .vermilion/bitwise-research
          rustup run "$verus_toolchain" rustc --edition=2021 \
            --crate-name subtle --crate-type rlib \
            case-studies/dalek-lite/subtle_stub.rs \
            -o .vermilion/bitwise-research/libsubtle_stub.rlib
          VERUS_VIR_EXPORT="$repository/.vermilion/bitwise-research/vir.bin" \
            "$verus" case-studies/dalek-lite/layer_a.rs --crate-type=lib \
            --extern "subtle=$repository/.vermilion/bitwise-research/libsubtle_stub.rlib" \
            --no-verify \
            > .vermilion/bitwise-research/frontend.stdout \
            2> .vermilion/bitwise-research/frontend.stderr
          ./crates/vermilion_direct/target/release/vermilion_direct \
            .vermilion/bitwise-research/vir.bin \
            --out .vermilion/bitwise-research/ir.sexp
          source scripts/lean_env.sh
          vrml_lake_build_if_stale vrml_gen Vermilion
          ./.lake/build/bin/vrml_gen --mode per-function \
            --generated-root case-studies/dalek-lite/generated \
            .vermilion/bitwise-research/ir.sexp
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path("case-studies/dalek-lite/generated/bit_lemmas.json").read_text())
          wanted = {"0a4e09fc4eccff1f", "635d62c1edcb1059"}
          matches = [o for o in source["obligations"] if o["statement_hash"] in wanted]
          assert len(matches) == 2, f"Expected 2 exact historical proofs, got {len(matches)}"
          assert {m["statement_hash"] for m in matches} == wanted
          assert all(m["assert_id"] == "bv_5_0" for m in matches)
          print("TWO_HISTORICAL_STATEMENT_HASHES_MATCH_FRESH_GENERATION")
          PY
      - name: Compile complete original bit-lemmas twin with two migrated proofs
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          evidence="$PWD/.vermilion/bitwise-research"
          python3 scripts/migrate_dalek_bitwise_twin.py \
            --output "$evidence/migrated-original-twin.lean" \
            --receipt "$evidence/migrated-receipt.json"
          source scripts/lean_env.sh
          mkdir -p "$evidence/bit_lemmas"
          cp case-studies/dalek-lite/generated/bit_lemmas/Specs.lean \
             "$evidence/bit_lemmas/Specs.lean"
          export LEAN_PATH="$evidence:$LEAN_PATH"
          timeout 480s lean -o "$evidence/bit_lemmas/Specs.olean" \
            "$evidence/bit_lemmas/Specs.lean" \
            > "$evidence/original-specs.stdout" 2> "$evidence/original-specs.stderr"
          test ! -s "$evidence/original-specs.stderr"
          timeout 600s lean "$evidence/migrated-original-twin.lean" \
            > "$evidence/migrated-twin.stdout" 2> "$evidence/migrated-twin.stderr"
          test ! -s "$evidence/migrated-twin.stderr"
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path(".vermilion/bitwise-research/migrated-receipt.json").read_text())
          assert not report["whole_case_study_verified"]
          assert report["full_twin_sync_and_kernel_acceptance_pending"]
          print("COMPLETE_ORIGINAL_BIT_LEMMAS_UNIT_COMPILED_WITH_TWO_MIGRATED_PROOFS")
          PY
          (cd "$evidence" && sha256sum migrated-original-twin.lean \
            migrated-receipt.json migrated-twin.stdout migrated-twin.stderr > integration-SHA256SUMS)
      - name: Preserve original-unit integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dalek-bitwise-full-unit-trial
          path: |
            .vermilion/bitwise-research/migrated-original-twin.lean
            .vermilion/bitwise-research/migrated-receipt.json
            .vermilion/bitwise-research/migrated-twin.stdout
            .vermilion/bitwise-research/migrated-twin.stderr
            .vermilion/bitwise-research/original-specs.stdout
            .vermilion/bitwise-research/original-specs.stderr
            .vermilion/bitwise-research/integration-SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve success or diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dalek-bitwise-proof-trial
          path: .vermilion/bitwise-research/
          if-no-files-found: warn
          retention-days: 14
