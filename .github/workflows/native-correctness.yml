name: Vermilion Native Correctness

on:
  push:
    branches:
      - verify/native-acceptance
      - main
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: "Run expensive research case studies (including known outstanding proofs)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: vermilion-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Python protocol checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check syntax and classifier regressions
        run: |
          python3 -m py_compile scripts/run_differential.py scripts/differential_outcomes.py scripts/differential_soundness.py scripts/check_capture_goals.py
          python3 -m unittest discover -s tests -p test_differential_outcomes.py -v
          python3 -m unittest discover -s tests -p test_capture_goal_guard.py -v

  native:
    name: Focused Rust, Verus and Lean acceptance
    needs: protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libc++-dev libc++abi-dev libgmp-dev \
            cmake ninja-build pkg-config libssl-dev curl unzip zstd git
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs |
              sh -s -- -y --profile minimal
          fi
          if ! command -v elan >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
              sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned native build cache
        id: native-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.cache/vermilion/verus
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            ~/.elan/toolchains
            .lake
            target
            crates/vermilion_direct/target
          key: native-v3-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'Cargo.lock', 'crates/vermilion_direct/Cargo.lock', 'scripts/setup_verus.sh', 'crates/vermilion_direct/src/lower.rs') }}
          restore-keys: |
            native-v3-${{ runner.os }}-
      - name: Build pinned native toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          ./scripts/build.sh
      - name: Save reusable build after successful native compilation
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.cache/vermilion/verus
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            ~/.elan/toolchains
            .lake
            target
            crates/vermilion_direct/target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Run Rust lowering tests
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          repository="$PWD"
          source scripts/verus_env.sh
          ( cd crates/vermilion_direct && rustup run "$verus_toolchain" cargo test )
      - name: Verify independent capture cases — per function
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          rm -f .vermilion/differential-cache.json docs/reports/generated/differential-m1-results.md
          python3 scripts/run_differential.py --emit-mode per-function
          python3 scripts/differential_soundness.py \
            docs/reports/generated/differential-m1-results.md tests/differential
          python3 scripts/check_capture_goals.py .
          mkdir -p .vermilion/ci-evidence
          cp docs/reports/generated/differential-m1-results.md .vermilion/ci-evidence/per-function-report.md
          tar -czf .vermilion/ci-evidence/per-function-generated.tar.gz -C tests/differential generated
      - name: Verify independent capture cases — per file
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          rm -f .vermilion/differential-cache.json docs/reports/generated/differential-m1-results.md
          python3 scripts/run_differential.py --emit-mode per-file
          python3 scripts/differential_soundness.py \
            docs/reports/generated/differential-m1-results.md tests/differential
          python3 scripts/check_capture_goals.py .
          mkdir -p .vermilion/ci-evidence
          cp docs/reports/generated/differential-m1-results.md .vermilion/ci-evidence/per-file-report.md
          tar -czf .vermilion/ci-evidence/per-file-generated.tar.gz -C tests/differential generated
          ( cd .vermilion/ci-evidence && sha256sum *.md *.tar.gz > sha256sums.txt )
      - name: Run upstream smoke and contract suite
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          ./scripts/run_suite.sh --smoke
      - name: Run full research case-study suite — explicit manual gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_suite }}
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          ./scripts/run_suite.sh
      - name: Upload generated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-verification-evidence
          path: |
            docs/reports/generated/differential-m1-results.md
            tests/differential/generated/
            .vermilion/ci-evidence/
          if-no-files-found: warn
          retention-days: 14
